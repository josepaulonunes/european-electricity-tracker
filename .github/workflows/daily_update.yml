name: Daily data update

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: pip install pandas requests entsoe-py

      - name: Download new data
        run: python update_data.py

      - name: Download new European data
        run: python -u update_europe.py
        timeout-minutes: 30
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}

      - name: Save the updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices_hourly.csv data/production_hourly.csv data/europe_prices.csv data/europe_production.csv
          git commit -m "Daily data update" || echo "No new data"
          git push